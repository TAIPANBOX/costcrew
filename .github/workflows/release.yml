name: release

# Publish the image to GitHub Container Registry, so that running this console
# does not mean building it.
#
#   ghcr.io/<owner>/costcrew:<tag>
#
# WHY THIS EXISTS, measured rather than assumed. On 2026-09-01 stack-k8s built
# this repository on a cluster node on every deploy that asked for the finops
# plane, and the console beside it took ten to fifteen minutes of that install
# for a four-language build whose source had not changed. Five of the estate's
# Go planes are pulled from ghcr.io and built by nobody; this is the same move
# for this one.
#
# Tags only, never a branch and never `latest`: an image tag that moves makes a
# pod that comes back different after a restart nobody ran, and a rollback then
# has nowhere to go. workflow_dispatch is here for a re-publish of an existing
# tag, which is the one case a manual run is honest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A pull request that changes THIS file builds the image and publishes
  # nothing: the `image` job below is held off on that event, and `image-build`
  # runs instead. Added 2026-09-02 after TokenFuse's first tag with a binaries
  # job, v0.4.2, failed on a step nothing had ever run: a workflow that runs
  # only on a tag is tested by the tag, which is the one moment nothing may
  # fail. estate-gates C17 holds this for every tag-only workflow.
  pull_request:
    paths: [".github/workflows/release.yml", ".github/actions/sbom-pair/action.yml"]

permissions:
  contents: read

jobs:
  image:
    name: build + push
    # Never on a pull request: this job pushes. The build itself is proven on
    # a pull request by `image-build` below.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # a job-level block replaces the workflow's, and checkout needs this
      packages: write
      id-token: write
      attestations: write
    steps:
      # Pinned by SHA rather than by tag, matching ci.yml in this repository. A
      # tag on somebody else's action is a mutable reference to code that runs
      # with this repository's GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The owner, lowercased, and this is not cosmetic. A registry repository
      # name MUST be lowercase, `github.repository_owner` is whatever the
      # organisation is actually called, and this one is TAIPANBOX. The first
      # tag this workflow ever saw failed on exactly that:
      #
      #     invalid tag "ghcr.io/TAIPANBOX/costcrew:v0.1.0":
      #     repository name must be lowercase
      #
      # tokenfuse's release does not hit it because it goes through
      # docker/metadata-action, which lowercases on the way past; this one talks
      # to buildx directly, so it has to do it itself. Done here rather than by
      # hardcoding the owner, so a fork publishes to its own namespace instead
      # of failing on somebody else's permissions.
      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures under one manifest, so the same pinned tag works on
      # a Graviton node and an amd64 one and nobody has to know which they got.
      # It is nearly free here: the Dockerfile cross-compiles from BUILDPLATFORM
      # rather than running an amd64 toolchain under QEMU, which is what makes
      # a Go multi-arch build cost seconds instead of minutes.
      - name: build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/costcrew:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=costcrew
          cache-to: type=gha,mode=max,scope=costcrew

      # The image is signed by digest and its provenance attested, keyless. A
      # stranger verifies with
      #   cosign verify ghcr.io/taipanbox/costcrew:<tag> \
      #     --certificate-identity-regexp '^https://github.com/TAIPANBOX/costcrew/\.github/workflows/release\.yml@refs/tags/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   gh attestation verify oci://ghcr.io/taipanbox/costcrew:<tag> -R TAIPANBOX/costcrew
      #
      # Keyless: the certificate names this workflow at this tag, so there is no
      # signing key to leak and nothing to rotate. The image reference here is
      # the literal lowercase `taipanbox`, not the owner-lowercasing step above:
      # the organisation is always TAIPANBOX and the two happen to agree, but
      # this line does not depend on that step having run first.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign the image by digest, keyless
        run: cosign sign --yes "ghcr.io/taipanbox/costcrew@${{ steps.push.outputs.digest }}"
      - name: provenance attestation for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/taipanbox/costcrew
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # What was published, said in the run's own log. A workflow that pushes an
      # image and prints nothing leaves "which digest is this tag" answerable
      # only by pulling it.
      - name: say what was published
        run: |
          echo "published ghcr.io/${{ steps.owner.outputs.name }}/costcrew:${{ github.ref_name }}"
          docker buildx imagetools inspect \
            "ghcr.io/${{ steps.owner.outputs.name }}/costcrew:${{ github.ref_name }}"

  # The same Dockerfile, built and never pushed, so a pull request that edits
  # this file proves the build on both platforms before a tag has to. amd64 is
  # loaded and executed, which is the only way to know the image starts; arm64
  # is built without loading, which proves the cross-compile from
  # BUILDPLATFORM still works.
  image-build:
    # Pushes to the registry by digest, so it needs the package scope the
    # top level no longer grants; `contents: read` repeated for the checkout.
    permissions:
      contents: read
      packages: write
    name: build only, no push
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build amd64 and load it
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: costcrew:pr
          cache-from: type=gha,scope=costcrew
      - name: the image starts on this architecture
        # Exit codes are ignored on purpose: the console's flag parser exits
        # non-zero on -h by design, and a check that goes red on a correct build
        # is worse than none. What is checked is that the binary executes here
        # rather than failing with "exec format error", and that it answers.
        run: |
          set -u
          out=$(timeout 20 docker run --rm costcrew:pr -h 2>&1 || true)
          printf '%s\n' "$out" | head -5
          case "$out" in
            *"exec format error"*) echo "built for another architecture"; exit 1 ;;
            "") echo "the image printed nothing"; exit 1 ;;
          esac
      - name: build arm64, no load
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=costcrew

  # Exercise the SBOM action and its output paths before a release tag uses
  # them. The v0.2.1 release job failed after scanning because dist/ did not
  # exist; image-build alone could not catch a release-page failure.
  release-sbom-check:
    name: release SBOM check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generate and validate both SBOM files
        uses: ./.github/actions/sbom-pair

  # A GitHub Release for every tag, carrying an SBOM and a provenance
  # attestation of this build even though nothing binary is attached: the
  # image above is signed and attested on its own, in its own job, and this
  # is the record a stranger lands on from the tag itself rather than from a
  # registry pull. Tag-only, same as `image`: a pull request proves this file
  # parses and its steps are spelled right, never that it can publish.
  release:
    name: release page
    needs: image
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generate and validate both SBOM files
        uses: ./.github/actions/sbom-pair
      - name: provenance attestation for the SBOMs
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: the provenance bundle as a release asset too
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.intoto.jsonl
      # A Release for every tag: --verify-tag aborts when the tag is not on
      # the remote; the notes are generated from the merged pull requests
      # until this plane writes its own for a given tag.
      - name: release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the Release, or upload into one that already exists: the tags
          # cut before this job existed got their Release objects by hand on
          # 2026-09-12, and a re-dispatch against one of them must add the
          # assets rather than fail on a page that is already there.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
