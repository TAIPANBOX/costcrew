{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · CostCrew</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
<nav>
  <div class="brand">CostCrew</div>
  <a href="/" {{if eq .Nav "overview"}}aria-current="page"{{end}}>Overview</a>
  <a href="/anomalies" {{if eq .Nav "anomalies"}}aria-current="page"{{end}}>
    Anomalies {{if .OpenCount}}<span class="count">{{.OpenCount}}</span>{{end}}
  </a>
  <a href="/budgets" {{if eq .Nav "budgets"}}aria-current="page"{{end}}>Budgets</a>
  <a href="/crew" {{if eq .Nav "crew"}}aria-current="page"{{end}}>Crew</a>
  <div class="group">Account</div>
  <a href="/logout" onclick="event.preventDefault();document.getElementById('lo').submit()">Sign out</a>
  <form id="lo" method="post" action="/logout" hidden>
    <input type="hidden" name="csrf" value="{{.CSRF}}">
  </form>
</nav>
<main>
{{if .Msg}}<p class="msg">{{.Msg}}</p>{{end}}
{{template "content" .}}
</main>
</div>
</body>
</html>{{end}}
