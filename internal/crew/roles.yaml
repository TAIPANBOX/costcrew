    hands_up: ["purchase", "infra.change", "message.team"]
    hands_up_text: "any anomaly over T.anomaly; any anomaly whose evidence points at two causes or at another desk; anything that would need a recurring driver; every option that is a purchase, infra.change or message.team."
    quality_bar: "first-pass acceptance at or above T.firstpass over a rolling two sprints; the bench (B7) scores its named causes on known cases."
