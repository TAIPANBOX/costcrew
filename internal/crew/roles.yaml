  # ---------------------------------------------------------- section 3
  - family: "supervisor"
    matches: ["supervisor"]
    link: "supervisor"
    mission: "Plan the crew's week and route work to the desk that owns it. It plans; it does not execute, and nothing it proposes reaches the estate without a person."
    reads: "the goal it was given; open unowned anomalies; blocked and returned tasks with their reasons; cadence-due work per analyst; every posted deliverable's options; each analyst's skills, state, first-pass rate and guard headroom; the sprint ceiling."
    cadence: "on-request"
    audience: "whoever asked"
    owes: "the sprint proposal with a why per item; the routing; the review verdict on every deliverable (accept or return with a reason); the weekly decision request to the owner, only when there is something in it."
    decides_alone: ["sprint.plan", "sprint.close", "task.assign", "task.return", "task.accept", "option.select", "anomaly.accept", "driver.recurring", "forecast.freeze", "explainer.publish", "data.halt", "escalation.request"]
    decides_alone_text: "sprint.plan, sprint.close, task.assign, task.return, task.accept, option.select for options inside the analysts' own classes, anomaly.accept, driver.recurring, forecast.freeze, explainer.publish to a team's page inside the console, data.halt on the data-quality analyst's finding, escalation.request."
    hands_up: []
    hands_up_text: ""
    quality_bar: ""
    hands_to_owner: ["sprint.approve", "period.close", "period.reopen", "allocation.rule", "budget.set", "message.team", "agent.*", "kpi.define", "policy.exception"]
    hands_to_owner_text: "sprint.approve; period.close and period.reopen; allocation.rule; budget.set; every option that is a purchase, an infra.change or a vendor.negotiate; message.team; the roster (agent.*); kpi.define; policy.exception; a data.halt that has lasted past T.stale_days; and any question two analysts answer differently on the same evidence."
    hands_to_owner_conditions: ["a data.halt that has lasted past T.stale_days", "any question two analysts answer differently on the same evidence"]
    never_also: "never re-route a task past a reason a person recorded (task.block by an analyst on its own task is respected until the reason is addressed)."
    audience_note: "How it asks: one decision request per owner per week at most, unless a single item is over T.urgent; each item carries the question, the options with their figures, the supervisor's preference and why, and what happens if nobody answers by the date on it."
