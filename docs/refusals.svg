<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/costcrew</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">costcrew</text>
<text x="216" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- what it refuses to do</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">Three refusals, and each one is why the numbers beside them stay believable.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#ff6b63" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; IT ENFORCES NOTHING</text><rect x="40" y="150" width="380" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="60" y="186" font-size="14" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">An analyst that executes its own</text><text x="60" y="206" font-size="14" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">conclusions is not an analyst.</text><rect x="56" y="232" width="348" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="232" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="74" y="256" font-size="14.5" fill="#e6edf3" font-weight="600">no outbound call while serving</text><text x="74" y="274" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">no exec.Command anywhere in</text><text x="74" y="291" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the console&#x27;s own tree</text><rect x="56" y="306" width="348" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="306" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="74" y="330" font-size="14.5" fill="#e6edf3" font-weight="600">enforced: false</text><text x="74" y="348" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">stamped on every event it puts</text><text x="74" y="365" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">on the shared bus</text><rect x="56" y="380" width="348" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="380" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="74" y="404" font-size="14.5" fill="#e6edf3" font-weight="600">internal/enforce is separate</text><text x="74" y="422" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a different binary, and the</text><text x="74" y="439" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">console never imports it</text><text x="60" y="480" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Stopping things belongs to the planes</text><text x="60" y="500" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">that were built to stop them:</text><rect x="58" y="516" width="236" height="22" rx="11" fill="#1a212c" stroke="#e3b341" stroke-width="1.4"/><text x="176.0" y="531" font-size="11" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">tokenfuse: a 402 mid-run</text><rect x="58" y="552" width="236" height="22" rx="11" fill="#1a212c" stroke="#4493f8" stroke-width="1.4"/><text x="176.0" y="567" font-size="11" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">vouchryx: authority ends</text><rect x="58" y="588" width="290" height="22" rx="11" fill="#1a212c" stroke="#b48cff" stroke-width="1.4"/><text x="203.0" y="603" font-size="11" fill="#b48cff" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">genaryx: the console over both</text><text x="458" y="138" font-size="12" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; FOUND, NEVER SAVED</text><rect x="456" y="150" width="368" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="476" y="186" font-size="14" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Nothing is saved until somebody</text><text x="476" y="206" font-size="14" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">acts and the invoice changes.</text><rect x="472" y="232" width="336" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="472" y="232" width="4" height="62" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="490" y="256" font-size="14.5" fill="#e6edf3" font-weight="600">the crew found</text><text x="490" y="274" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">1,254.35 since the board opened</text><text x="490" y="291" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">15,052.20 annualised</text><rect x="472" y="306" width="336" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="472" y="306" width="4" height="62" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="490" y="330" font-size="14.5" fill="#e6edf3" font-weight="600">the crew cost</text><text x="490" y="348" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">3,871.35 across 310 tasks</text><text x="490" y="365" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">its own model spend, measured</text><rect x="472" y="380" width="336" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="472" y="380" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="490" y="404" font-size="14.5" fill="#e6edf3" font-weight="600">the page prints the ratio</text><text x="490" y="422" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">0.32, and does not soften it</text><text x="490" y="439" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a bad quarter is reportable</text><text x="476" y="486" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">A console that reports found money as</text><text x="476" y="506" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">saved is disbelieved the first time</text><text x="476" y="526" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">finance checks it against the invoice,</text><text x="476" y="546" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">and after that every other figure it</text><text x="476" y="566" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">prints is suspect too.</text><text x="862" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">03 &#183; A MEASURE MAY REFUSE</text><rect x="860" y="150" width="380" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="880" y="186" font-size="14" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">A library where everything reports</text><text x="880" y="206" font-size="14" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">is one where several are invented.</text><rect x="876" y="232" width="348" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="876" y="232" width="4" height="54" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="894" y="256" font-size="14.5" fill="#e6edf3" font-weight="600">nine report a number</text><text x="894" y="274" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">and four of them meet target</text><rect x="876" y="298" width="348" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="876" y="298" width="4" height="54" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="894" y="322" font-size="14.5" fill="#e6edf3" font-weight="600">three refuse, by name</text><text x="894" y="340" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">and say what is missing</text><text x="880" y="396" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">The refusal it will not talk around:</text><rect x="876" y="412" width="348" height="76" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="876" y="412" width="4" height="76" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="894" y="436" font-size="14.5" fill="#e6edf3" font-weight="600">per-agent AI spend</text><text x="894" y="454" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a charge carries a model and a</text><text x="894" y="471" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">workload, never an agent</text><text x="880" y="516" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">It becomes answerable when the calls</text><text x="880" y="536" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">go through tokenfuse with an agent id.</text><text x="880" y="556" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Until then the page says so instead of</text><text x="880" y="576" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">inventing an attribution.</text></svg>