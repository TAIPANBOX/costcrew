<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/costcrew</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">costcrew</text>
<text x="216" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- FinOps, staffed by agents</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">A crew of agents takes the bill apart. A person stamps every line before it counts.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; WHAT ARRIVES</text><rect x="40" y="150" width="268" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="56" y="172" width="236" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="172" width="4" height="54" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="74" y="196" font-size="14.5" fill="#e6edf3" font-weight="600">AWS Data Exports</text><text x="74" y="214" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">FOCUS 1.2 &#183; free</text><rect x="56" y="242" width="236" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="242" width="4" height="54" rx="2" ry="2" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><text x="74" y="266" font-size="14.5" fill="#e6edf3" font-weight="600">Cost Explorer</text><text x="74" y="284" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">api &#183; metered per call</text><rect x="56" y="312" width="236" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="312" width="4" height="54" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="74" y="336" font-size="14.5" fill="#e6edf3" font-weight="600">GCP billing export</text><text x="74" y="354" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">BigQuery &#183; free</text><rect x="56" y="382" width="236" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="382" width="4" height="54" rx="2" ry="2" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><text x="74" y="406" font-size="14.5" fill="#e6edf3" font-weight="600">Azure Cost Management</text><text x="74" y="424" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">FOCUS &#183; free</text><rect x="56" y="452" width="236" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="452" width="4" height="54" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="74" y="476" font-size="14.5" fill="#e6edf3" font-weight="600">Kubecost / OpenCost</text><text x="74" y="494" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">kubernetes</text><rect x="56" y="522" width="236" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="522" width="4" height="54" rx="2" ry="2" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><text x="74" y="546" font-size="14.5" fill="#e6edf3" font-weight="600">Anthropic &#183; OpenRouter</text><text x="74" y="564" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">model usage APIs</text><rect x="56" y="592" width="236" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="592" width="4" height="54" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="74" y="616" font-size="14.5" fill="#e6edf3" font-weight="600">SaaS seats</text><text x="74" y="634" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">vendor exports</text><text x="346" y="138" font-size="12" fill="#2dd4bf" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; THE DETECTOR</text><rect x="344" y="150" width="236" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="360" y="182" font-size="14" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start">median + robust deviation</text><text x="360" y="201" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">two-sided, by day type</text><rect x="360" y="216" width="204" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="360" y="216" width="4" height="62" rx="2" ry="2" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><text x="378" y="240" font-size="14.5" fill="#e6edf3" font-weight="600">a fall counts</text><text x="378" y="258" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a dead feed looks the same</text><rect x="360" y="290" width="204" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="360" y="290" width="4" height="62" rx="2" ry="2" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><text x="378" y="314" font-size="14.5" fill="#e6edf3" font-weight="600">Sunday vs Sundays</text><text x="378" y="332" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">rhythm is not an incident</text><rect x="360" y="364" width="204" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="360" y="364" width="4" height="62" rx="2" ry="2" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><text x="378" y="388" font-size="14.5" fill="#e6edf3" font-weight="600">ranked by money</text><text x="378" y="406" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">not by how far out it is</text><rect x="360" y="438" width="204" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="360" y="438" width="4" height="62" rx="2" ry="2" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><text x="378" y="462" font-size="14.5" fill="#e6edf3" font-weight="600">the rule travels</text><text x="378" y="480" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">every finding carries it</text><text x="462" y="540" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">one finding</text><text x="462" y="558" font-size="12.5" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">2,054.10 above baseline</text><text x="462" y="578" font-size="11" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">aws &#183; Amazon EC2 &#183; one day</text><text x="618" y="138" font-size="12" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">03 &#183; THE CREW, AND THE GATE</text><rect x="616" y="150" width="300" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="632" y="172" width="268" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="632" y="172" width="4" height="62" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="650" y="196" font-size="14.5" fill="#e6edf3" font-weight="600">a task, and a guard</text><text x="650" y="214" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">one analyst, its desk, a ceiling</text><text x="650" y="231" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">on what it may spend</text><rect x="632" y="250" width="268" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="632" y="250" width="4" height="62" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="650" y="274" font-size="14.5" fill="#e6edf3" font-weight="600">the analyst works</text><text x="650" y="292" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">rights follow from its skills</text><text x="650" y="309" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">39 on the roster</text><rect x="632" y="328" width="268" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="632" y="328" width="4" height="62" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="650" y="352" font-size="14.5" fill="#e6edf3" font-weight="600">a draft comes back</text><text x="650" y="370" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">marked as written by a model,</text><text x="650" y="387" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">changing nothing yet</text><line x1="766" y1="396" x2="766" y2="424" stroke="#283341" stroke-width="1.4" opacity="0.9"/><rect x="632" y="426" width="268" height="74" rx="12" fill="#16211b" stroke="#3fb950" stroke-width="1.8"/><text x="766" y="456" font-size="15" fill="#3fb950" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">a person stamps it</text><text x="766" y="476" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">the only step an agent</text><text x="766" y="492" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">cannot take</text><line x1="766" y1="500" x2="766" y2="526" stroke="#283341" stroke-width="1.4" opacity="0.9"/><rect x="632" y="528" width="268" height="54" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="632" y="528" width="4" height="54" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="650" y="552" font-size="14.5" fill="#e6edf3" font-weight="600">returned instead</text><text x="650" y="570" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">lands on that analyst's card,</text><text x="650" y="587" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">next to its first-pass rate</text><text x="766" y="616" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">enforced: false, stamped on every event</text><text x="766" y="634" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">this console stops nothing, by design</text><text x="954" y="138" font-size="12" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">04 &#183; WHAT FINANCE GETS</text><rect x="952" y="150" width="288" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="968" y="172" width="256" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="968" y="172" width="4" height="70" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="986" y="196" font-size="14.5" fill="#e6edf3" font-weight="600">allocation</text><text x="986" y="214" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">shared cost placed by a rule</text><text x="986" y="231" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a team can dispute</text><rect x="968" y="258" width="256" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="968" y="258" width="4" height="70" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="986" y="282" font-size="14.5" fill="#e6edf3" font-weight="600">chargeback close</text><text x="986" y="300" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the period freezes, and the</text><text x="986" y="317" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">numbers stop moving</text><rect x="968" y="344" width="256" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="968" y="344" width="4" height="70" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="986" y="368" font-size="14.5" fill="#e6edf3" font-weight="600">general ledger CSV</text><text x="986" y="386" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">showback &#183; exec packet</text><text x="986" y="403" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">results &#183; crew &#183; budget</text><rect x="968" y="430" width="256" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="968" y="430" width="4" height="70" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="986" y="454" font-size="14.5" fill="#e6edf3" font-weight="600">KPI library</text><text x="986" y="472" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">nine report a number,</text><text x="986" y="489" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">three refuse and say why</text><line x1="968" y1="520" x2="1224" y2="520" stroke="#222b38" stroke-width="1" opacity="0.9"/><text x="968" y="546" font-size="14" fill="#3fb950" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">found, never saved</text><text x="968" y="568" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">nothing is saved until</text><text x="968" y="586" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">somebody acts on it</text><text x="968" y="624" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">found 1,254.35 &#183; cost 3,871.35</text><text x="968" y="642" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">the console prints the ratio anyway</text><path d="M 318 401 L 327 410 L 318 419" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 590 401 L 599 410 L 590 419" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 926 401 L 935 410 L 926 419" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>